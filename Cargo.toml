[package]
name = "echo"
version = "0.1.0"
edition = "2024"

[lib]
name = "echo"
path = "src/lib.rs"

# Only the executable carries the elevation manifest.
[[bin]]
name = "echo"
path = "src/main.rs"
test = false

[dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
