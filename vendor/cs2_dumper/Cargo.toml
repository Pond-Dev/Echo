[package]
name = "cs2-dumper"
version = "0.1.3"
authors = ["a2x"]
edition = "2024"
repository = "https://github.com/a2x/cs2-dumper"
license = "MIT"

[lib]
name = "cs2_dumper"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
heck = "0.5"
log = "0.4"
memflow = "0.2"
pelite = "0.10"
phf = { version = "0.13", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
memflow-native = { git = "https://github.com/memflow/memflow-native", rev = "937b57c6cf7ba0b8cba4948f453a7ab5d57d943f" }

[dev-dependencies]
simplelog = "0.12"
